version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: migrainerelief-api:latest
    container_name: migrainerelief-core
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DUCKDB_PATH=:memory:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
